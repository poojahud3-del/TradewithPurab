  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
      color:#fff;
      background:#050505;
      overflow-x:hidden;
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      width:320px;
      height:320px;
      border-radius:50%;
      filter:blur(100px);
      opacity:.18;
      z-index:-1;
      animation:float 7s ease-in-out infinite alternate;
    }

    body::before{
      background:#00aaff;
      top:-100px;
      left:-100px;
    }

    body::after{
      background:#0066ff;
      right:-100px;
      bottom:-100px;
      animation-delay:2s;
    }

    @keyframes float{
      from{transform:translate(0,0)}
      to{transform:translate(40px,30px)}
    }

    .container{
      width:100%;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px 15px;
    }

    .card{
      width:100%;
      max-width:440px;
      padding:38px 24px 28px;
      text-align:center;
      border:1px solid rgba(255,255,255,.12);
      border-radius:28px;
      background:rgba(17,17,17,.82);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);
    }

    .logo{
      width:78px;
      height:78px;
      margin:0 auto 20px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:900;
      background:linear-gradient(135deg,#00b7ff,#0055ff);
      box-shadow:0 0 35px rgba(0,153,255,.35);
    }

    .badge{
      display:inline-block;
      padding:7px 13px;
      margin-bottom:15px;
      border-radius:30px;
      font-size:12px;
      font-weight:bold;
      letter-spacing:1px;
      background:rgba(0,170,255,.1);
      border:1px solid rgba(0,170,255,.25);
      color:#65d1ff;
    }

    h1{
      font-size:36px;
      line-height:1.05;
      font-weight:900;
      letter-spacing:-1px;
      margin-bottom:13px;
    }

    h1 span{
      color:#29bfff;
    }

    .subtitle{
      color:#a7a7a7;
      font-size:15px;
      line-height:1.6;
      margin-bottom:27px;
    }

    .telegram-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      padding:17px;
      border-radius:14px;
      text-decoration:none;
      color:#fff;
      font-size:17px;
      font-weight:800;
      background:linear-gradient(135deg,#229ed9,#147fc0);
      box-shadow:0 12px 30px rgba(34,158,217,.25);
      transition:.25s ease;
    }

    .telegram-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 35px rgba(34,158,217,.35);
    }

    .telegram-btn:active{
      transform:scale(.97);
    }

    .telegram-icon{
      font-size:23px;
    }

    .features{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      margin-top:25px;
    }

    .feature{
      padding:13px 5px;
      border-radius:13px;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.07);
    }

    .feature strong{
      display:block;
      font-size:16px;
      margin-bottom:4px;
    }

    .feature small{
      color:#858585;
      font-size:10px;
    }

    .divider{
      height:1px;
      background:rgba(255,255,255,.08);
      margin:25px 0 18px;
    }

    .note{
      color:#707070;
      font-size:11px;
      line-height:1.5;
    }

    .footer{
      margin-top:15px;
      color:#4f4f4f;
      font-size:10px;
    }

    @media(max-width:380px){
      h1{
        font-size:31px;
      }

      .card{
        padding:32px 18px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">TP</div>

      <div class="badge">
        ● TRADING COMMUNITY
      </div>

      <h1>
        TRADE WITH <span>PURAB</span>
      </h1>

      <p class="subtitle">
        Join our Telegram channel for trading updates,
        market insights and educational content.
      </p>

      <a
        class="telegram-btn"
        href="https://t.me/+K5fh54FKpElyNzU1"
        onclick="fbq('track','Lead');"
      >
        <span class="telegram-icon">➤</span>
        JOIN TELEGRAM CHANNEL
      </a>

      <div class="features">

        <div class="feature">
          <strong>📊</strong>
          <small>Market Updates</small>
        </div>

        <div class="feature">
          <strong>📈</strong>
          <small>Trading Insights</small>
        </div>

        <div class="feature">
          <strong>🎯</strong>
          <small>Learn & Grow</small>
        </div>

      </div>

      <div class="footer">
        © 2026 Trade With Purab
      </div>

    </div>

  </div>

</body>
</html>
